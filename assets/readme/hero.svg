<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">WhatCoffee — a coffee picker and recipe shelf</title>
  <desc id="desc">Warm editorial title artwork with a coffee selection reel showing Cortado, a question mark, and Shakerato, plus a Surprise me button.</desc>

  <rect width="1200" height="440" rx="28" fill="#fcf8f1"/>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="27.25" fill="none" stroke="#ded1c2" stroke-width="1.5"/>

  <g id="title-block" transform="translate(64 55)">
    <text x="0" y="0" fill="#6b6159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" letter-spacing="3">LOCAL-FIRST · OPEN SOURCE</text>
    <text x="0" y="96" fill="#2b1d16" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="600" letter-spacing="-5">whatcoffee</text>
    <path d="M0 125H565" stroke="#c8b8a7" stroke-width="1.5"/>
    <text x="0" y="174" fill="#2b1d16" font-family="Georgia, 'Times New Roman', serif" font-size="29">A coffee picker and recipe shelf</text>
    <text x="0" y="212" fill="#6b6159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Spin for a drink. Tune your preferences. Make the cup.</text>

    <g transform="translate(0 292)">
      <text x="0" y="0" fill="#2b1d16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">50+ RECIPES</text>
      <circle cx="157" cy="-6" r="3" fill="#c58c5a"/>
      <text x="178" y="0" fill="#6b6159" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">PREFERENCE-AWARE</text>
      <circle cx="393" cy="-6" r="3" fill="#c58c5a"/>
      <text x="414" y="0" fill="#6b6159" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">INSTALLABLE PWA</text>
    </g>
  </g>

  <g id="coffee-reel" transform="translate(720 42)">
    <rect width="416" height="356" rx="24" fill="#f5ede2" stroke="#ded1c2" stroke-width="1.5"/>
    <text x="30" y="40" fill="#6b6159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="2">WHAT SHOULD I MAKE?</text>
    <text x="386" y="41" text-anchor="end" fill="#9f6543" font-family="Georgia, 'Times New Roman', serif" font-size="22">?</text>

    <path d="M30 72H386" stroke="#c8b8a7" stroke-width="1.5"/>
    <text x="208" y="111" text-anchor="middle" fill="#6b6159" fill-opacity="0.55" font-family="Georgia, 'Times New Roman', serif" font-size="23">Cortado</text>
    <text x="208" y="191" text-anchor="middle" fill="#2b1d16" font-family="Georgia, 'Times New Roman', serif" font-size="78">?</text>
    <text x="208" y="232" text-anchor="middle" fill="#6b6159" fill-opacity="0.55" font-family="Georgia, 'Times New Roman', serif" font-size="23">Shakerato</text>
    <path d="M30 255H386" stroke="#c8b8a7" stroke-width="1.5"/>

    <g transform="translate(30 278)">
      <rect width="356" height="54" rx="16" fill="#2b1d16"/>
      <text x="21" y="34" fill="#fffaf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="650">Surprise me</text>
      <text x="335" y="35" text-anchor="end" fill="#fffaf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Symbol', sans-serif" font-size="24">↻</text>
    </g>
  </g>
</svg>
