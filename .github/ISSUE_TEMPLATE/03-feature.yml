name: Feature request
description: Suggest an improvement to the website or contributor experience
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for sharing an idea for WhatCoffee. Focus on the problem first so different solutions can be considered.

  - type: checkboxes
    id: existing_issue
    attributes:
      label: Existing issue
      options:
        - label: I searched the existing issues and did not find this request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need, limitation, or user experience problem.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Explain how you imagine the feature working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or workarounds you considered.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context or mockups
      description: Add screenshots, sketches, links, or other supporting material.

