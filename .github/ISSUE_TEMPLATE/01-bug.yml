name: Bug report
description: Report something that is not working correctly
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve WhatCoffee. Please include enough detail for someone else to reproduce the problem.

  - type: checkboxes
    id: existing_issue
    attributes:
      label: Existing issue
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
      placeholder: Tell us what went wrong and what you expected to see.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. See...
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop
        - Mobile
        - Tablet
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Include the browser version when possible.
      placeholder: Chrome 142, Safari 26, Firefox 144...
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Screenshots or additional context
      description: Drag screenshots into this field or add any other useful information.

